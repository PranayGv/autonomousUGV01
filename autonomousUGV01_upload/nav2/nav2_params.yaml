# Nav2 params for the UGV01 tank + L2 LiDAR (Point-LIO SLAM).
# Frames: map -> odom (static identity) -> base_link (Point-LIO) ; scan from the L2.
# No static map_server: global costmap is a rolling window (live SLAM navigation).

bt_navigator:
  ros__parameters:
    global_frame: camera_init
    robot_base_frame: base_link
    odom_topic: /aft_mapped_to_init
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    enable_stamped_cmd_vel: false   # publish geometry_msgs/Twist (UGV01 driver subscribes Twist, not TwistStamped)
    # Point-LIO publishes odometry here (not the default /odom); the MPPI
    # OdomSmoother needs it or the controller aborts with "Failed to make progress".
    odom_topic: /aft_mapped_to_init
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.30
      stateful: True
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40
      model_dt: 0.05
      batch_size: 1500
      vx_std: 0.2
      wz_std: 0.4
      vx_max: 0.35
      vx_min: -0.2
      wz_max: 1.2
      # This MPPI build loads motion models via pluginlib: motion_model names the
      # sub-namespace, whose .plugin gives the class.
      motion_model: "DiffDrive"
      DiffDrive:
        plugin: "mppi::DiffDriveMotionModel"
      TrajectoryValidator:
        plugin: "mppi::DefaultOptimalTrajectoryValidator"
      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "GoalCritic", "GoalAngleCritic", "PreferForwardCritic",
                "ObstaclesCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic"]
      ConstraintCritic: {enabled: true, cost_power: 1, cost_weight: 4.0}
      GoalCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, threshold_to_consider: 1.0}
      GoalAngleCritic: {enabled: true, cost_power: 1, cost_weight: 3.0, threshold_to_consider: 0.5}
      PreferForwardCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, threshold_to_consider: 0.5}
      ObstaclesCritic: {enabled: true, cost_power: 1, repulsion_weight: 1.5, critical_weight: 20.0,
                        consider_footprint: true, collision_cost: 10000.0, near_goal_distance: 0.5}
      PathAlignCritic: {enabled: true, cost_power: 1, cost_weight: 14.0, threshold_to_consider: 0.5}
      PathFollowCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, threshold_to_consider: 1.4}
      PathAngleCritic: {enabled: true, cost_power: 1, cost_weight: 2.0, threshold_to_consider: 0.5}

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: camera_init
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
# UGV01 body outline (metres), base_link at centre: 0.232 L x 0.197 W
      footprint: "[ [0.116, 0.098], [0.116, -0.098], [-0.116, -0.098], [-0.116, 0.098] ]"
      footprint_padding: 0.02
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          obstacle_max_range: 6.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.25

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: camera_init
      robot_base_frame: base_link
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05
# UGV01 body outline (metres), base_link at centre: 0.232 L x 0.197 W
      footprint: "[ [0.116, 0.098], [0.116, -0.098], [-0.116, -0.098], [-0.116, 0.098] ]"
      footprint_padding: 0.02
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          obstacle_max_range: 6.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.25

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_frame: camera_init
    global_frame: camera_init
    robot_base_frame: base_link
    enable_stamped_cmd_vel: false   # publish geometry_msgs/Twist (match the UGV01 driver)
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:      {plugin: "nav2_behaviors::Spin"}
    backup:    {plugin: "nav2_behaviors::BackUp"}
    drive_on_heading: {plugin: "nav2_behaviors::DriveOnHeading"}
    wait:      {plugin: "nav2_behaviors::Wait"}
    simulate_ahead_time: 2.0

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.35, 0.0, 1.2]
    min_velocity: [-0.2, 0.0, -1.2]
    max_accel: [0.5, 0.0, 2.0]
    max_decel: [-0.5, 0.0, -2.0]
    odom_topic: "/odom"
    odom_duration: 0.1
